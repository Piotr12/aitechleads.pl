# Name of your application. Used to uniquely configure containers.
service: aitechleads

# Name of the container image.
image: aitechleads

# Deploy to these servers.
servers:
  web:
    - 146.59.105.8

# Persistent data: the SQLite database and every other file the app writes. The image sets
# DATA_DIR=/externaldata; the host directory must be writable by the container user (uid 1001).
volumes:
  - "/externaldata/aitechleads.pl:/externaldata"

# Runtime configuration (see packages/core/src/config.ts). Secrets come from .kamal/secrets.
env:
  clear:
    APP_URL: https://aitechleads.pl
    ADMIN_GITHUB_IDS: "9336697" # Piotr12
  secret:
    - AUTH_GITHUB_ID
    - AUTH_GITHUB_SECRET

# kamal-proxy terminates TLS with a Let's Encrypt certificate for these hosts.
proxy:
  ssl: true
  hosts:
    - aitechleads.pl
    - www.aitechleads.pl
  app_port: 3000
  healthcheck:
    path: /up

# Local registry: the image is pushed to a registry on the deploying machine and
# pulled by the server through the SSH tunnel, so no external registry is needed.
registry:
  server: localhost:5555

builder:
  arch: amd64

ssh:
  user: ubuntu

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
